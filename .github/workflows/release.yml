name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: image names
        id: names
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.backend
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: APP_VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ steps.names.outputs.owner }}/attool-backend:${{ github.ref_name }}
            ghcr.io/${{ steps.names.outputs.owner }}/attool-backend:latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.frontend
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: APP_VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ steps.names.outputs.owner }}/attool-frontend:${{ github.ref_name }}
            ghcr.io/${{ steps.names.outputs.owner }}/attool-frontend:latest
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
