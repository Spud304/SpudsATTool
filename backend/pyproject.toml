[project]
name = "attool-backend"
version = "0.1.0"
description = "Alliance Tournament / Anger Games team organizer backend"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "django-ninja>=1.4",
    "channels>=4.2",
    "channels-redis>=4.2",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "pyjwt[crypto]>=2.10",
    "psycopg[binary,pool]>=3.2",
    "environs>=14",
    "cryptography>=44",
    "whitenoise>=6.9",
    "redis>=5.2",
    "dj-database-url>=3.1.2",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.10",
    "pytest-asyncio>=0.25",
    "hypothesis>=6.130",
    "ruff>=0.11",
    "ty>=0.0.1a",
    "django-stubs>=5.2",
    "types-pyyaml>=6.0",
    "factory-boy>=3.3",
    "responses>=0.25",
    "pytest-playwright>=0.9.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["apps", "config", "tests", "scripts", "playwright_tests"]

