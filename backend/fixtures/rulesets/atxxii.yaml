schema_version: 1
verified: true
tournament:
  code: ATXXII
  name: Alliance Tournament XXII
  organiser: ccp
  server: tranquility
  year: 2026
  starts_on: '2026-08-29'
  ends_on: '2026-11-01'
  rules_url: https://www.eveonline.com/news/view/alliance-tournament-xxii-rules-and-regulations
ruleset:
  fielded_pilots: 10
  point_cap: 200
  max_same_hull: 3
  duplicate_inflation:
    enabled: true
    mode: per_copy_all
  flagship:
    enabled: true
    immune_to_bans: true
    exempt_from_size_limit: true
    counts_for_same_hull: true
    counts_for_inflation: true
    lost_permanently: true
    eligible_sizes:
    - BS
    eligible_meta_groups:
    - Faction
    - Tech I
    - Tech II
  unique_ship_extra_bans: 2
  unspent_points_to_opponent: true
  kill_points_source: comp_cost
  match:
    tiebreak: potential_dps_t0
    point_threshold: null
  roster:
    max: 40
    merc_max: 10
  ships_inference: prefix
  extra: {}
hull_sizes:
- {size: FLAG, label: Flagship, max_per_comp: 1, duplicate_surcharge: 0}
- {size: BS, label: Battleship, max_per_comp: 2, duplicate_surcharge: 4}
- {size: BC, label: Battlecruiser, max_per_comp: 3, duplicate_surcharge: 3}
- {size: CR, label: Cruiser, max_per_comp: 3, duplicate_surcharge: 2}
- {size: LC, label: Logistics Cruiser, max_per_comp: 1, duplicate_surcharge: 1}
- {size: DE, label: Destroyer, max_per_comp: 3, duplicate_surcharge: 1}
- {size: FR, label: Frigate, max_per_comp: 3, duplicate_surcharge: 0}
- {size: LF, label: Logistics Frigate, max_per_comp: 2, duplicate_surcharge: 1}
- {size: IN, label: Industrial, max_per_comp: 3, duplicate_surcharge: 2}
- {size: CV, label: Corvette, max_per_comp: 3, duplicate_surcharge: 0}
group_limits:
- code: logistics
  label: Logistics
  max: 2
  message: 1 logi cruiser or 2 logi frigates
  members:
  - {hull_size: LC, weight: 2}
  - {hull_size: LF, weight: 1}
stages:
- {code: prelim, label: Swiss preliminaries, best_of: 1, bans_per_side: 3, ban_order: ABBAAB, blind: false, ban_targets: hull, flagship_uses: 0}
- {code: bracket, label: Finals bracket, best_of: 3, bans_per_side: 4, ban_order: ABBAABAB, blind: false, ban_targets: hull, avalanche: {loser: 2, winner: 1, blind: true, persists: true}, flagship_uses: 3}
- {code: final, label: Grand final, best_of: 5, bans_per_side: 4, ban_order: ABBAABAB, blind: false, ban_targets: hull, avalanche: {loser: 2, winner: 1, blind: true, persists: true}, flagship_uses: 5}
