module_rules:
  default: {allowed_meta_groups: [Tech I, Tech II]}
  by_group:
  - {groups: [Sensor Dampener, Weapon Disruptor], categories: [], max_meta_level: 4, hulls: bonused_only, note: Only on hulls with a bonus to them; Meta 4 at most.}
  - {groups: [Combat Drone], categories: [], allowed_meta_groups: [Tech I, Faction], hulls: any, note: "T1 and navy faction combat and sentry drones only. T2 drones are banned; 'Augmented', 'Integrated', Gecko, Aralez and the faction hybrid drones are banned by name."}
  - {groups: [Logistic Drone], categories: [], allowed_meta_groups: [Tech I], hulls: any, note: Only T1 logistics drones.}
  - {groups: [Electronic Warfare Drone, Energy Neutralizer Drone, Stasis Webifying Drone], categories: [], allowed_meta_groups: [Tech I], hulls: any, note: Electronic warfare drones are allowed; their faction variants are not.}
  - {groups: [], categories: [Implant], max_meta_level: 3, hulls: any, note: "Only hardwirings ending in 01, 02 or 03. Pirate sets and Genolution CA implants fail this cap."}
  - {groups: [Cyber Leadership], categories: [], allowed_meta_groups: [Tech I, Tech II, Faction], hulls: any, note: "All leadership mindlinks are allowed, including navy and Guri Malakim."}
  - {groups: [Cyber Learning], categories: [], allowed_meta_groups: [Tech I], hulls: any, note: "Attribute enhancers for perception, intelligence, willpower, memory and charisma."}
  banned_types: [Gecko, Aralez]
  banned_groups: [Booster]
  allowed_name_patterns: ["Cerebral Accelerator$", "^Basic Glamourex Booster$"]
  banned_name_patterns: ["^'(Augmented|Integrated)'\\s", "-\\d{3}-I$"]
  flagship:
    allowed_meta_groups: [Deadspace, Faction, Officer, Storyline, Tech I, Tech II]
    # The module families the rules post lists (2026-09-22), as SDE groups. Drones are not among them.
    groups:
    - Energy Weapon
    - Hybrid Weapon
    - Projectile Weapon
    - Precursor Weapon
    - Vorton Projector
    - Missile Launcher Light
    - Missile Launcher Rapid Light
    - Missile Launcher Heavy
    - Missile Launcher Heavy Assault
    - Missile Launcher Rapid Heavy
    - Missile Launcher Cruise
    - Missile Launcher Torpedo
    - Missile Launcher Rapid Torpedo
    - Missile Launcher Rocket
    - Stasis Web
    - Smart Bomb
    - Propulsion Module
    - Micro Jump Drive
    - Warp Scrambler
    - Stasis Grappler
    - Target Painter
    - Sensor Booster
    - Signal Amplifier
    - Overdrive Injector System
    - Nanofiber Internal Structure
    - Inertial Stabilizer
    - Ballistic Control System
    - Gyrostabilizer
    - Heat Sink
    - Magnetic Field Stabilizer
    - Entropic Radiation Sink
    - Vorton Projector Upgrade
    - Tracking Enhancer
    - Missile Guidance Enhancer
    - Drone Damage Modules
    - Drone Tracking Modules
    - Drone Tracking Enhancer
    - Drone Navigation Computer
    - Drone Control Range Module
    - Armor Plate
    - Shield Extender
    - Damage Control
    - Shield Booster
    - Ancillary Shield Booster
    - Armor Repair Unit
    - Ancillary Armor Repairer
text_sections:
- heading: Flagship
  body: 'One pre-declared T1, T2 or faction battleship (Bhaalgorn excluded). Not allowed in the preliminaries; in the main tournament it may be fielded in any match
    until destroyed, then never again. Immune to bans. May fit faction, officer, COSMOS and deadspace versions of the listed module families (turrets and launchers,
    webs, smartbombs, prop mods and MJDs, points and grapplers, target painters, sensor boosters and signal amplifiers, overdrives, nanofibers and inertial stabilizers,
    weapon and drone upgrades, plates and extenders, damage controls); abyssal modules stay banned. Of the repair modules only ONE shield booster (ancillary or not)
    or up to TWO armor repairers may ignore meta restrictions: that count is not machine-checked.'
- heading: Uniques
  body: 'Geri, Bestla, Cybele, Shapash, Cobra, Sidewinder, Skua and Anhinga, main tournament only. Regular fitting rules, at most one fielded at a time. Once per
    Bo1 match; once per Bo3 series (used in round 1, it cannot come back in round 2 or 3); twice per Bo5. Declaring one gives the opponent two extra bans (one regular, one on uniques).'

  source_url: https://www.eveonline.com/news/view/alliance-tournament-xxii-rules-and-regulations
- heading: Ships and modules (not machine-checked)
  body: 'Max 3 of any hull size, battleships max 2 (flagship exempt). T2 rigs banned. Ancillary shield boosters max 1 per ship. ECM only on ECM-bonused hulls. Battleships: one armor plate or two shield
    extenders. Pirate faction ammunition banned; navy faction ammo, missiles and capacitor booster charges allowed. Under-fielded points count for the opponent.'
  source_url: https://www.eveonline.com/news/view/alliance-tournament-xxii-rules-and-regulations
